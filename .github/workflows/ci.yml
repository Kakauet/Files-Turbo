# Abstract:
#   CI for Files Turbo. Runs the Turbo unit tests, builds the app (Release, x64)
#   and checks the formatting of changed XAML files on every push to main and
#   on every pull request. Upstream's CI only runs in the files-community
#   organization, so this fork keeps its own.

name: Files Turbo CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  TURBO_TESTS_PROJECT_PATH: 'tests/Files.App.Turbo.UnitTests'
  TEST_RESULTS_DIR: '${{ github.workspace }}\artifacts\TestResults'

jobs:

  unit-tests:

    runs-on: windows-2025-vs2026

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Run Files Turbo unit tests
      shell: pwsh
      run: |
        dotnet test --project $env:TURBO_TESTS_PROJECT_PATH `
          -c Release `
          -p:Platform=x64 `
          --results-directory $env:TEST_RESULTS_DIR `
          --report-trx

    - if: always()
      name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: 'Turbo unit test results'
        path: ${{ env.TEST_RESULTS_DIR }}
        if-no-files-found: ignore

  build:

    runs-on: windows-2025-vs2026

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=x64 `
          -p:Configuration=Release `
          -p:PublishReadyToRun=true `
          -v:quiet

    - name: Build Files Turbo
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=Release `
          -p:Platform=x64 `
          -p:AppxBundle=Never `
          -p:GenerateAppxPackageOnBuild=false `
          -v:quiet

  check-formatting:

    if: github.event_name == 'pull_request'

    runs-on: windows-2025-vs2026

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Install XamlStyler.Console
      run: 'dotnet tool install --global XamlStyler.Console'

    - name: Check XAML formatting
      shell: pwsh
      run: |
        $base = '${{ github.event.pull_request.base.sha }}'
        $changedFiles = git diff --diff-filter=d --name-only $base HEAD | Where-Object { $_ -like '*.xaml' }
        $failed = $false
        foreach ($file in $changedFiles)
        {
          xstyler -p -l None -f $file
          if ($LASTEXITCODE -ne 0)
          {
            echo "::error file=$file::Format check failed"
            $failed = $true
          }
        }
        if ($failed) { exit 1 }
