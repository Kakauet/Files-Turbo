name: Bug Report
description: Report a problem in Files Turbo.
labels: ['bug']
title: 'Bug: '
body:

  # Tip to warn of checking for existing issues
  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Have you checked for similar issues? There's a possibility the bug you are experiencing has already been reported. Please do a thorough search before creating a new issue.

  # Description
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the issue is.
    validations:
      required: true

  # Step To Reproduce
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  # Upstream comparison
  - type: dropdown
    id: upstream
    attributes:
      label: Does it also happen in the official Files app?
      description: If it does, it is an upstream bug; please report it to files-community/Files instead.
      options:
        - "No, only in Files Turbo"
        - "I have not tried Files"
    validations:
      required: true

  # Files Turbo Version
  - type: input
    id: files_version
    attributes:
      label: Files Turbo Version
      description: Which version of Files Turbo are you using? To copy it, access it from Settings -> About -> Copy -> Files version.
      placeholder: "e.g. 4.3.0.8"
    validations:
      required: true

  # Windows Version
  - type: input
    id: windows_version
    attributes:
      label: Windows Version
      description: Which version of Windows are you using? To copy your Windows version, access it from Settings -> About -> Copy -> Windows version.
      placeholder: "e.g. 10.0.26200.1000"
    validations:
      required: true

  # Note that the user should always upload the report rather than pasting it.
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > The log file can be accessed from **Settings → About → Open log location**. If you cannot access the UI, you can locate the file [manually](https://files.community/docs/getting-started/faq#:~:text=How%20to%20Locate%20the%20Log%20File).
        >
        > Feel free to remove potentially sensitive information such as usernames or drive names before uploading the file.

  # Log File
  - type: upload
    attributes:
      label: Log File
    validations:
      required: false
      accept: ".log"
